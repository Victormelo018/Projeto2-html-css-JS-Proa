<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <img src="img/logo (1).png" class="logo">

        <div class="content">

            <p>Website Is Under Maintenance</p>

            <h1>
                We're <span>Launching</span> Soon
            </h1>

            <div class="launch-time">

                <div>
                    <p id="days">00</p>
                    <span>Days</span>
                </div>

                <div>
                    <p id="hours">00</p>
                    <span>Hours</span>
                </div>

                <div>
                    <p id="minutes">00</p>
                    <span>Minutes</span>
                </div>

                <div>
                    <p id="seconds">00</p>
                    <span>Seconds</span>
                </div>

            </div>

            <button type="button">
                Learn More
                <img src="img/triangle (1).png">
            </button>

        </div>

        <img src="img/rocket (1).png" class="rocket">

    </div>

    <script src="js/script.js"></script>

</body>

</html>
